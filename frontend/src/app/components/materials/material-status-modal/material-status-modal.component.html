<div class="modal-header">
  <h4 class="modal-title">{{ title }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()">×</button>
</div>

<div class="modal-body">
  <form [formGroup]="form">
    <!-- Material Info -->
    <div class="material-info">
      <h5>{{ material.name }}</h5>
      <p class="text-muted">{{ material.reference }}</p>
    </div>

    <!-- Status Change -->
    <div class="mb-3" *ngIf="changeType === 'status'">
      <label for="status" class="form-label">Nouveau statut</label>
      <select
        class="form-select"
        [class.is-invalid]="submitted && f['status'].invalid"
        id="status"
        formControlName="status"
      >
        <option value="">Sélectionner un statut</option>
        <option *ngFor="let status of statuses" [value]="status">
          {{ getStatusLabel(status) }}
        </option>
      </select>
      <div class="invalid-feedback" *ngIf="submitted && f['status'].invalid">
        Veuillez sélectionner un statut
      </div>
    </div>

    <!-- Condition Change -->
    <div class="mb-3" *ngIf="changeType === 'condition'">
      <label for="condition" class="form-label">Nouvel état</label>
      <select
        class="form-select"
        [class.is-invalid]="submitted && f['currentCondition'].invalid"
        id="condition"
        formControlName="currentCondition"
      >
        <option value="">Sélectionner un état</option>
        <option *ngFor="let condition of conditions" [value]="condition">
          {{ getConditionLabel(condition) }}
        </option>
      </select>
      <div class="invalid-feedback" *ngIf="submitted && f['currentCondition'].invalid">
        Veuillez sélectionner un état
      </div>
    </div>

    <!-- Notes -->
    <div class="mb-3">
      <label for="notes" class="form-label">Notes (optionnel)</label>
      <textarea
        class="form-control"
        id="notes"
        formControlName="notes"
        rows="3"
        placeholder="Ajoutez des détails sur ce changement..."
      ></textarea>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()">
    Annuler
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="submit()"
    [disabled]="isLoading"
  >
    <span *ngIf="!isLoading">Enregistrer</span>
    <span *ngIf="isLoading">
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Traitement...
    </span>
  </button>
</div>
