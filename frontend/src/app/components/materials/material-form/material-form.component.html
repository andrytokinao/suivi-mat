<div class="modal-header">
  <h4 class="modal-title">
    {{ isEditMode ? 'Modifier le matériel' : 'Ajouter un nouveau matériel' }}
  </h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form">
    <!-- Nom -->
    <div class="mb-3">
      <label for="name" class="form-label">Nom du matériel <span class="text-danger">*</span></label>
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="submitted && f['name'].invalid"
        id="name"
        formControlName="name"
        placeholder="Ex: Station totale Leica"
      />
      <div class="invalid-feedback" *ngIf="submitted && f['name'].errors">
        <span *ngIf="f['name'].errors['required']">Le nom est requis</span>
        <span *ngIf="f['name'].errors['minlength']">Au minimum 3 caractères</span>
      </div>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea
        class="form-control"
        id="description"
        formControlName="description"
        rows="3"
        placeholder="Décrivez le matériel..."
      ></textarea>
    </div>

    <!-- Catégorie -->
    <div class="mb-3">
      <label for="categoryId" class="form-label">Catégorie <span class="text-danger">*</span></label>
      <select
        class="form-select"
        [class.is-invalid]="submitted && f['categoryId'].invalid"
        id="categoryId"
        formControlName="categoryId"
      >
        <option [value]="null">Sélectionner une catégorie</option>
        <option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.name }}
        </option>
      </select>
      <div class="invalid-feedback" *ngIf="submitted && f['categoryId'].errors">
        Veuillez sélectionner une catégorie
      </div>
    </div>

    <!-- Condition -->
    <div class="mb-3">
      <label for="currentCondition" class="form-label">État actuel</label>
      <select class="form-select" id="currentCondition" formControlName="currentCondition">
        <option *ngFor="let condition of conditions" [value]="condition">
          {{ condition }}
        </option>
      </select>
    </div>

    <!-- ID d'achat -->
    <div class="mb-3">
      <label for="purchaseId" class="form-label">Référence d'achat</label>
      <input
        type="text"
        class="form-control"
        id="purchaseId"
        formControlName="purchaseId"
        placeholder="Ex: BON-ACHAT-001"
      />
    </div>

    <p class="text-muted small">
      <i class="fa fa-info-circle"></i>
      La référence et le numéro de série seront générés automatiquement.
    </p>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()">
    Annuler
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="submit()"
    [disabled]="isLoading"
  >
    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
    {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
  </button>
</div>
