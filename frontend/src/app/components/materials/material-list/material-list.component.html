<div class="material-container">

  <!-- HEADER : menu à gauche / recherche à droite -->
  <div class="header">

    <!-- Menu catégories -->
    <app-menue-category></app-menue-category>

    <!-- Recherche -->
    <span class="search-box">
      <mat-form-field appearance="outline" class="search-field">
      <input matInput placeholder="Rechercher " />
    <button
    mat-icon-button
    matSuffix
    *ngIf="searchValue"
    (click)="searchValue=''"
    aria-label="Clear"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
      <i class="fa fa-search"></i>
    </span>

  </div>

  <!-- CONTENU PRINCIPAL -->
  <div class="content-wrapper">

    <!-- Liste des matériels -->
    <main class="materials-section">

      <div class="results-info">
        <span class="results-count">
          {{ filteredMaterials.length }} résultat(s)
        </span>
      </div>

      <div class="materials-grid">

        <div class="material-card" *ngFor="let m of pagedMaterials">

          <div class="card-header">
            <h4 class="material-name">{{ m.name }}</h4>
            <span
              class="badge"
              [ngClass]="m.currentCondition.toLowerCase()"
            >
              {{ m.currentCondition }}
            </span>
          </div>

          <div class="card-body">

            <div class="info-row">
              <span class="info-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M20 7h-9M14 17H5M6 12h12"/>
                </svg>
                Catégorie
              </span>
              <span class="info-value">
                {{ m.categoryObj?.name || 'Non catégorisé' }}
              </span>
            </div>

            <div class="info-row">
              <span class="info-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                Référence
              </span>
              <span class="info-value">{{ m.reference }}</span>
            </div>

            <div class="info-row" *ngIf="m.quantifiable">
              <span class="info-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                  <line x1="19" y1="8" x2="19" y2="14"/>
                  <line x1="22" y1="11" x2="16" y2="11"/>
                </svg>
                Quantité
              </span>
              <span class="info-value quantity">
                {{ m.quantity }}
              </span>
            </div>

          </div>
        </div>

        <!-- Aucun résultat -->
        <div
          class="no-results"
          *ngIf="filteredMaterials.length === 0"
        >
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <h3>Aucun matériel trouvé</h3>
          <p>Essayez de modifier vos critères de recherche</p>
        </div>

      </div>

      <!-- Pagination -->
      <div class="pagination" *ngIf="totalPages > 1">

        <button
          class="pagination-btn"
          (click)="prevPage()"
          [disabled]="page === 1"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <div class="pagination-pages">
          <button
            *ngFor="let p of getPageNumbers()"
            class="page-number"
            [class.active]="p === page"
            (click)="goToPage(p)"
          >
            {{ p }}
          </button>
        </div>

        <button
          class="pagination-btn"
          (click)="nextPage()"
          [disabled]="page === totalPages"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

      </div>

    </main>
  </div>
</div>
