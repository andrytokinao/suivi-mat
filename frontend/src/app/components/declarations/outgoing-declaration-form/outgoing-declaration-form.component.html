<div class="modal-header">
  <h4 class="modal-title">{{ isEditMode ? 'Modifier la déclaration' : 'Nouvelle déclaration de sortie' }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form">
    <!-- Declared By -->
    <div class="mb-3">
      <label for="declaredBy" class="form-label">Déclarant</label>
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="submitted && f['declaredBy'].invalid"
        id="declaredBy"
        formControlName="declaredBy"
        placeholder="Nom du déclarant"
      />
      <div class="invalid-feedback" *ngIf="submitted && f['declaredBy'].invalid">
        Le déclarant est requis
      </div>
    </div>

    <!-- Usage Purpose -->
    <div class="mb-3">
      <label for="usagePurpose" class="form-label">Raison de la sortie</label>
      <input
        type="text"
        class="form-control"
        [class.is-invalid]="submitted && f['usagePurpose'].invalid"
        id="usagePurpose"
        formControlName="usagePurpose"
        placeholder="Ex: Intervention sur site client"
      />
      <div class="invalid-feedback" *ngIf="submitted && f['usagePurpose'].invalid">
        La raison est requise
      </div>
    </div>

    <!-- Materials -->
    <div class="mb-3">
      <label class="form-label">Matériels à déclarer</label>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead class="table-light">
          <tr>
            <th>Matériel</th>
            <th>Quantité</th>
            <th></th>
          </tr>
          </thead>
          <tbody formArrayName="materials">
          <tr *ngFor="let item of materials.controls; let i = index" [formGroupName]="i">
            <td>
              <select class="form-select form-select-sm" formControlName="materialId">
                <option value="">Sélectionner</option>
                <option *ngFor="let m of availableMaterials" [value]="m.id">
                  {{ m.name }}
                </option>
              </select>
            </td>
            <td>
              <input
                type="number"
                class="form-control form-control-sm"
                formControlName="quantity"
                min="1"
              />
            </td>
            <td>
              <button type="button" class="btn btn-sm btn-danger" (click)="removeMaterial(i)">
                <i class="fa fa-trash"></i>
              </button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <button type="button" class="btn btn-sm btn-secondary" (click)="addMaterial()">
        <i class="fa fa-plus"></i> Ajouter un matériel
      </button>
    </div>

    <!-- Note -->
    <div class="mb-3">
      <label for="note" class="form-label">Note (optionnel)</label>
      <textarea
        class="form-control"
        id="note"
        formControlName="note"
        rows="3"
        placeholder="Détails supplémentaires..."
      ></textarea>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()">
    Annuler
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="submit()"
    [disabled]="isLoading"
  >
    <span *ngIf="!isLoading">Enregistrer</span>
    <span *ngIf="isLoading">
      <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
      Traitement...
    </span>
  </button>
</div>
