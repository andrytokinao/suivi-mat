<div class="declarations-container">

  <!-- Header -->
  <div class="header">
    <h2>Déclarations de matériels</h2>
  </div>

  <!-- Error Message -->
  <div class="alert alert-danger" *ngIf="error">
    {{ error }}
  </div>

  <!-- Loading Spinner -->
  <div class="spinner-container" *ngIf="isLoading">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content" *ngIf="!isLoading">

    <!-- Filters -->
    <div class="filters-section mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Rechercher</label>
          <input
            type="text"
            class="form-control"
            placeholder="Par déclarant ou note..."
            [(ngModel)]="searchTerm"
            (ngModelChange)="applyFilters()"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Type</label>
          <select
            class="form-select"
            [(ngModel)]="filterType"
            (ngModelChange)="applyFilters()"
          >
            <option value="ALL">Tous</option>
            <option value="OUTGOING">Sorties</option>
            <option value="RETURN">Retours</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Statut</label>
          <select
            class="form-select"
            [(ngModel)]="filterStatus"
            (ngModelChange)="applyFilters()"
          >
            <option value="ALL">Tous</option>
            <option *ngFor="let status of statuses" [value]="status">
              {{ status }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="declarations.length === 0">
      <p>Aucune déclaration trouvée.</p>
    </div>

    <!-- Declarations Table -->
    <div class="table-responsive" *ngIf="declarations.length > 0">
      <table class="table table-hover">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Type</th>
            <th>Déclarant</th>
            <th>Date</th>
            <th>Note</th>
            <th>Statut</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let decl of pagedDeclarations">
            <td>#{{ decl.id }}</td>
            <td>
              <span class="badge" [class.bg-info]="decl.declarationType === 'OUTGOING'" [class.bg-success]="decl.declarationType === 'RETURN'">
                {{ decl.declarationType }}
              </span>
            </td>
            <td>{{ decl.declaredBy }}</td>
            <td>{{ decl.declarationDate | date: 'short' }}</td>
            <td>{{ decl.note }}</td>
            <td>
              <span class="badge" [ngClass]="getStatusBadgeClass(decl.status)">
                {{ decl.status }}
              </span>
            </td>
            <td>
              <div class="btn-group btn-group-sm">
                <button
                  class="btn btn-success"
                  *ngIf="decl.status === DeclarationStatus.PENDING"
                  (click)="approveDeclaration(decl)"
                  title="Approuver"
                >
                  <i class="fa fa-check"></i>
                </button>
                <button
                  class="btn btn-danger"
                  *ngIf="decl.status === DeclarationStatus.PENDING"
                  (click)="rejectDeclaration(decl)"
                  title="Rejeter"
                >
                  <i class="fa fa-times"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation" *ngIf="totalPages > 1" class="mt-4">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="page === 1">
          <button class="page-link" (click)="prevPage()" [disabled]="page === 1">
            Précédent
          </button>
        </li>
        <li class="page-item" *ngFor="let p of [].constructor(totalPages); let i = index">
          <button
            class="page-link"
            [class.active]="(i + 1) === page"
            (click)="goToPage(i + 1)"
          >
            {{ i + 1 }}
          </button>
        </li>
        <li class="page-item" [class.disabled]="page === totalPages">
          <button class="page-link" (click)="nextPage()" [disabled]="page === totalPages">
            Suivant
          </button>
        </li>
      </ul>
    </nav>

  </div>

</div>
