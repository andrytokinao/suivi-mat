<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails de la déclaration - SuiviMat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<div class="container mt-4">

    <!-- Informations générales -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Informations générales</h5>
        </div>
        <div class="card-body row g-3">
            <div class="col-md-6">
                <label class="fw-bold text-muted">Déclaré par</label>
                <p><i class="bi bi-person-circle"></i> <span th:text="${declaration.declaredBy}">John Doe</span></p>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted">Date de déclaration</label>
                <p><i class="bi bi-calendar-event"></i>
                    <span th:text="${#temporals.format(declaration.declarationDate,'dd/MM/yyyy HH:mm')}">07/11/2025 14:30</span>
                </p>
            </div>
            <div class="col-md-6">
                <label class="fw-bold text-muted">Statut</label>
                <p>
                    <span th:text="${declaration.status}"
                          th:classappend="${declaration.status.name() == 'APPROVED' ? 'badge bg-success' :
                                           (declaration.status.name() == 'PENDING' ? 'badge bg-warning' : 'badge bg-danger')}">
                        PENDING
                    </span>
                </p>
            </div>
        </div>
    </div>

    <!-- Liste des mouvements -->
    <form>
        <div class="card mb-4 shadow-sm">
            <div class="card-header"
                 th:classappend="${isOutgoing != null and isOutgoing ? 'bg-primary text-white' : 'bg-info text-white'}">
                <h5 class="mb-0">Matériels déclarés</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Valider</th>
                        <th>Nom</th>
                        <th>Catégorie</th>
                        <th>Quantité</th>
                        <th>État</th>
                        <th>Rejeter</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${materialMovements}">
                        <td><input type="checkbox" th:name="'acceptedMovements'" th:value="${m.id}" checked></td>
                        <td th:text="${m.material.name}">Laptop HP</td>
                        <td th:text="${m.material.category?.name}">Informatique</td>
                        <td th:text="${m.quantity}">2</td>
                        <td th:text="${m.condition.name()}">GOOD</td>
                        <td><input type="checkbox" th:name="'rejectedMovements'" th:value="${m.id}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(materialMovements)}">
                        <td colspan="6" class="text-center text-muted">
                            <i class="bi bi-inbox"></i> Aucun matériel
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Commentaire du responsable -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Commentaire du responsable</h5>
            </div>
            <div class="card-body">
            <textarea class="form-control" name="responsableComment" rows="3"
                      th:text="${responsableComment}"></textarea>
            </div>
        </div>

        <!-- Bouton Valider -->
        <div class="d-flex justify-content-end mb-4">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Valider la déclaration
            </button>
        </div>
    </form>

</div>

</body>
</html>
