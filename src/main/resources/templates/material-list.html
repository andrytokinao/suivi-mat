<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des matériels - SuiviMat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Include Navbar -->
<div th:replace="~{layout :: navbar}"></div>

<!-- Page Content -->
<div class="container mt-4">
    <h2 class="mb-4">Liste des matériels</h2>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Statut</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="material : ${materials}">
                    <td th:text="${material.id}"></td>
                    <td th:text="${material.name}"></td>
                    <td>
                        <span th:text="${material.status}"
                              th:classappend="${material.status == 'BON' ? 'badge bg-success' : 'badge bg-warning'}">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Include Scripts -->
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
