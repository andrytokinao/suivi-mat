<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des déclarations - SuiviMat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{layout :: navbar}"></div>

<!-- Page Content -->
<div class="container mt-4">
    <h2 class="mb-4">Liste des déclarations</h2>

    <!-- Filtre Type avec boutons -->
    <div class="mb-3">
        <div class="btn-group" role="group" aria-label="Filtrer par type">
            <button type="button" class="btn btn-secondary" onclick="filterType('')">Tous</button>
            <button type="button" class="btn btn-primary" onclick="filterType('SORTIE')">Sortie</button>
            <button type="button" class="btn btn-info text-white" onclick="filterType('ENTREE')">Entrée</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <table id="declarationTable" class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Déclaré par</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Info</th>
                    <th>Validé par</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="decl : ${declarations}">
                    <td th:text="${decl.id}">1</td>
                    <td>
                        <span th:text="${decl.declarationType != null ? decl.declarationType : '—'}"
                              th:classappend="${decl.declarationType == 'SORTIE' ? 'badge bg-primary' : 'badge bg-info'}">
                        </span>
                    </td>
                    <td th:text="${decl.declaredBy != null ? decl.declaredBy : '—'}">John Doe</td>
                    <td th:text="${decl.declarationDate != null ? #temporals.format(decl.declarationDate, 'dd/MM/yyyy HH:mm') : '—'}">07/11/2025 14:30</td>
                    <td>
                        <span th:text="${decl.status != null ? decl.status : '—'}"
                              th:classappend="${decl.status.name() == 'APPROVED' ? 'badge bg-success' :
                                              (decl.status.name() == 'PENDING' ? 'badge bg-warning' : 'badge bg-danger')}">
                        </span>
                    </td>
                    <td th:text="${decl.additionalInfo != null ? decl.additionalInfo : '—'}">Infos supplémentaires</td>
                    <td th:text="${decl.validateBy != null ? decl.validateBy : '—'}">Responsable</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{layout :: scripts}"></div>
<script>
    function filterType(type) {
        const filter = type.toUpperCase();
        const table = document.getElementById('declarationTable');
        const rows = table.getElementsByTagName('tr');

        for (let i = 1; i < rows.length; i++) { // skip header
            const typeCell = rows[i].getElementsByTagName('td')[1];
            const span = typeCell.querySelector('span');
            const typeText = span ? span.textContent.trim().toUpperCase() : '';
            rows[i].style.display = (filter === "" || typeText === filter) ? "" : "none";
        }
    }
</script>

</body>
</html>
